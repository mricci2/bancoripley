<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Informe de Resultados POC · Banco Ripley · Costanera Center y Plaza Oeste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --black:#060A27; --purple:#863DFF; --grey:#9593A1; --turq:#7BE1C9;
  --lav:#CAC6FF; --lilac:#DDE0FF; --neon:#CBFF2E; --white:#FFFFFF; --border:#E6E6EF;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Hanken Grotesk',Arial,sans-serif;color:var(--black);background:#F4F4F9;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}

/* NAV */
nav{position:sticky;top:0;z-index:100;background:rgba(6,10,39,.96);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.08)}
nav .wrap{display:flex;align-items:center;gap:22px;height:56px;overflow-x:auto}
nav .logo{font-weight:800;color:#fff;font-size:18px;letter-spacing:-.5px;white-space:nowrap}
nav .logo span{color:var(--neon)}
nav .logo-img{height:26px;width:auto;display:block}
.cover-logo{height:34px;width:auto;margin-bottom:30px;position:relative;z-index:2}
footer .logo-img{height:22px;vertical-align:middle;margin-right:6px}
nav a{color:#B9B7C7;text-decoration:none;font-size:13px;font-weight:500;white-space:nowrap;transition:color .2s}
nav a:hover{color:#fff}

/* COVER */
.cover{background:var(--black);color:#fff;padding:90px 0 80px;position:relative;overflow:hidden}
.cover::after{content:"";position:absolute;right:-140px;top:-140px;width:460px;height:460px;border-radius:50%;background:radial-gradient(circle,rgba(134,61,255,.45),transparent 68%)}
.cover .tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--neon);border:1px solid rgba(203,255,46,.4);padding:5px 12px;border-radius:20px;margin-bottom:26px}
.cover h1{font-size:46px;font-weight:800;line-height:1.05;letter-spacing:-1.5px;max-width:820px;margin-bottom:20px}
.cover h1 em{font-style:normal;color:var(--lav)}
.cover p.sub{font-size:18px;color:#C9C7D6;max-width:640px;font-weight:400}
.cover .meta{display:flex;gap:30px;margin-top:38px;flex-wrap:wrap}
.cover .meta div{position:relative;z-index:2}
.cover .meta .k{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--grey)}
.cover .meta .v{font-size:16px;font-weight:600;color:#fff;margin-top:2px}

/* SECTIONS */
section{padding:60px 0}
.sec-label{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--purple);margin-bottom:10px}
h2{font-size:30px;font-weight:800;letter-spacing:-.8px;margin-bottom:14px;line-height:1.1}
.lead{font-size:17px;color:#4A4A5C;max-width:760px;margin-bottom:34px}
h3{font-size:20px;font-weight:700;margin:34px 0 12px;letter-spacing:-.3px}
p{margin-bottom:14px;color:#33333F}
strong{font-weight:700;color:var(--black)}

/* KPI GRID */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:14px;margin:8px 0 20px}
.kpi{background:var(--black);border-radius:16px;padding:22px 20px;position:relative;overflow:hidden}
.kpi .n{font-size:38px;font-weight:800;color:var(--neon);letter-spacing:-1px;line-height:1}
.kpi .n small{font-size:17px;font-weight:600}
.kpi .l{font-size:12.5px;color:#B9B7C7;margin-top:8px;font-weight:500}
.kpi.alt .n{color:var(--turq)}
.kpi.warn .n{color:#FF7A7A}

/* CARDS */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:24px}
.card.dark{background:var(--black);color:#fff;border:none}
.card.dark p,.card.dark li{color:#C9C7D6}
.chart-box{background:#fff;border:1px solid var(--border);border-radius:16px;padding:22px 24px;margin:18px 0}
.chart-box h4{font-size:15px;font-weight:700;margin-bottom:4px}
.chart-box .cap{font-size:13px;color:var(--grey);margin-bottom:16px}
.chart-wrap{position:relative;height:300px}
.chart-wrap.tall{height:360px}

/* BOARD QUESTIONS ACCORDION */
.q{background:#fff;border:1px solid var(--border);border-radius:16px;margin-bottom:14px;overflow:hidden;transition:box-shadow .2s}
.q.open{box-shadow:0 8px 30px rgba(6,10,39,.09)}
.q-head{display:flex;align-items:flex-start;gap:16px;padding:22px 24px;cursor:pointer;user-select:none}
.q-num{flex:0 0 34px;height:34px;border-radius:9px;background:var(--lilac);color:var(--purple);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px}
.q.open .q-num{background:var(--purple);color:#fff}
.q-title{flex:1;font-size:17px;font-weight:700;line-height:1.3;padding-top:4px}
.q-toggle{flex:0 0 auto;color:var(--purple);font-size:22px;font-weight:400;transition:transform .25s;padding-top:2px}
.q.open .q-toggle{transform:rotate(45deg)}
.q-body{max-height:0;overflow:hidden;transition:max-height .35s ease}
.q-inner{padding:0 24px 26px 74px}
.verdict{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:5px 12px;border-radius:20px;margin-bottom:14px}
.verdict.no{background:#FFECEC;color:#D64545}
.verdict.si{background:#E6F9F3;color:#1B9B7A}
.verdict.mid{background:#FFF4E0;color:#C88A1E}
.q-inner .datachip{display:inline-block;background:var(--black);color:var(--neon);font-weight:700;font-size:13px;padding:3px 10px;border-radius:7px;margin:2px 4px 2px 0}

/* INSIGHT CARDS */
.insight{background:#fff;border:1px solid var(--border);border-radius:16px;padding:24px;position:relative;transition:transform .18s,box-shadow .18s}
.insight:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(6,10,39,.1)}
.insight .badge{font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--purple);text-transform:uppercase}
.insight h4{font-size:17px;font-weight:700;margin:8px 0 8px;line-height:1.25}
.insight p{font-size:14.5px;color:#4A4A5C;margin:0}
.insight .stat{font-size:13px;color:var(--black);font-weight:600;margin-top:12px;padding-top:12px;border-top:1px dashed var(--border)}

/* MATURITY */
.ladder{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:8px}
.rung{border-radius:16px;padding:24px;color:#fff}
.rung.manage{background:linear-gradient(160deg,#863DFF,#6A2FCC)}
.rung.optimize{background:var(--black);border:1px solid #2A2E48}
.rung.transform{background:var(--black)}
.rung .st{font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;opacity:.85}
.rung h4{font-size:19px;font-weight:800;margin:6px 0 10px}
.rung .status{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:14px;margin-bottom:12px}
.rung.manage .status{background:var(--neon);color:var(--black)}
.rung.optimize .status,.rung.transform .status{background:rgba(255,255,255,.15);color:#fff}
.rung ul{list-style:none;font-size:13.5px}
.rung li{padding:6px 0 6px 22px;position:relative;color:#D8D6E4}
.rung li::before{content:"";position:absolute;left:0;top:12px;width:7px;height:7px;border-radius:50%;background:var(--turq)}
.rung.manage li::before{background:var(--neon)}

/* TABLE */
table{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0}
th{background:var(--black);color:#fff;text-align:left;padding:11px 14px;font-weight:600;font-size:12.5px}
th:first-child{border-radius:9px 0 0 0}th:last-child{border-radius:0 9px 0 0}
td{padding:10px 14px;border-bottom:1px solid var(--border)}
tr:hover td{background:#FAFAFE}
.pill{display:inline-block;padding:2px 9px;border-radius:12px;font-size:11.5px;font-weight:700}
.pill.bad{background:#FFECEC;color:#D64545}
.pill.mid{background:#FFF4E0;color:#C88A1E}
.pill.good{background:#E6F9F3;color:#1B9B7A}

/* RECOS */
.reco{display:flex;gap:18px;background:#fff;border:1px solid var(--border);border-left:4px solid var(--purple);border-radius:12px;padding:22px 24px;margin-bottom:14px}
.reco .pr{flex:0 0 auto;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#fff;background:var(--purple);height:fit-content;padding:4px 11px;border-radius:14px}
.reco.p2{border-left-color:var(--turq)}.reco.p2 .pr{background:var(--turq);color:var(--black)}
.reco.p3{border-left-color:var(--grey)}.reco.p3 .pr{background:var(--grey)}
.reco h4{font-size:16px;font-weight:700;margin-bottom:6px}
.reco p{font-size:14px;margin:0;color:#4A4A5C}
.reco .mods{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.reco .mod{font-size:11.5px;font-weight:600;background:var(--lilac);color:var(--purple);padding:3px 10px;border-radius:12px}

.wow{background:var(--black);border-radius:18px;padding:38px 40px;margin:30px 0;position:relative;overflow:hidden}
.wow::after{content:"";position:absolute;left:-60px;bottom:-80px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(203,255,46,.14),transparent 70%)}
.wow .q1{font-size:24px;font-weight:800;color:#fff;line-height:1.3;letter-spacing:-.5px;position:relative;z-index:2;max-width:760px}
.wow .q1 em{font-style:normal;color:var(--neon)}
.wow .attr{color:var(--grey);font-size:13px;margin-top:14px;position:relative;z-index:2}

footer{background:var(--black);color:var(--grey);padding:40px 0;font-size:12.5px}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px}
footer strong{color:#fff}

.note{font-size:12.5px;color:var(--grey);margin-top:8px}
.hl{background:linear-gradient(transparent 60%,var(--lav) 60%);font-weight:700}

@media(max-width:820px){
  .grid2,.grid3,.ladder{grid-template-columns:1fr}
  .cover h1{font-size:32px}
  h2{font-size:24px}
  .q-inner{padding-left:24px}
}
</style>
<!-- FALLBACK DE COLOR. No cambia el diseño: repite exactamente los mismos hex del molde sin usar var(), para visores que no resuelven variables CSS. -->
<style>
body{background:#F4F4F9;color:#060A27}
nav{background:rgba(6,10,39,.96)}
nav .logo span{color:#CBFF2E}
.cover{background:#060A27;color:#fff}
.cover .tag{color:#CBFF2E;border:1px solid rgba(203,255,46,.4)}
.cover h1 em{color:#CAC6FF}
.cover .meta .k{color:#9593A1}
.cover .meta .v{color:#fff}
.sec-label{color:#863DFF}
strong{color:#060A27}
.kpi{background:#060A27}
.kpi .n{color:#CBFF2E}
.kpi.alt .n{color:#7BE1C9}
.kpi.warn .n{color:#FF7A7A}
.card{background:#fff;border:1px solid #E6E6EF}
.card.dark{background:#060A27;color:#fff;border:none}
.card.dark p,.card.dark li{color:#C9C7D6}
.chart-box{background:#fff;border:1px solid #E6E6EF}
.chart-box .cap{color:#9593A1}
.q{background:#fff;border:1px solid #E6E6EF}
.q-num{background:#DDE0FF;color:#863DFF}
.q.open .q-num{background:#863DFF;color:#fff}
.q-toggle{color:#863DFF}
.q-inner .datachip{background:#060A27;color:#CBFF2E}
.insight{background:#fff;border:1px solid #E6E6EF}
.insight .badge{color:#863DFF}
.insight .stat{color:#060A27;border-top:1px dashed #E6E6EF}
.rung.manage{background:linear-gradient(160deg,#863DFF,#6A2FCC)}
.rung.optimize{background:#060A27;border:1px solid #2A2E48}
.rung.transform{background:#060A27}
.rung.manage .status{background:#CBFF2E;color:#060A27}
.rung li::before{background:#7BE1C9}
.rung.manage li::before{background:#CBFF2E}
th{background:#060A27;color:#fff}
td{border-bottom:1px solid #E6E6EF}
.reco{background:#fff;border:1px solid #E6E6EF;border-left:4px solid #863DFF}
.reco .pr{background:#863DFF;color:#fff}
.reco.p2{border-left-color:#7BE1C9}
.reco.p2 .pr{background:#7BE1C9;color:#060A27}
.reco.p3{border-left-color:#9593A1}
.reco.p3 .pr{background:#9593A1}
.reco .mod{background:#DDE0FF;color:#863DFF}
.wow{background:#060A27}
.wow .q1{color:#fff}
.wow .q1 em{color:#CBFF2E}
.wow .attr{color:#9593A1}
footer{background:#060A27;color:#9593A1}
footer strong{color:#fff}
.note{color:#9593A1}
.hl{background:linear-gradient(transparent 60%,#CAC6FF 60%)}
</style>
<style>
#gate{position:fixed;inset:0;z-index:9999;background:#060A27;display:flex;align-items:center;justify-content:center;padding:24px;font-family:'Hanken Grotesk',Arial,sans-serif}
#gate .box{width:100%;max-width:420px;text-align:center}
#gate .lg{height:30px;margin-bottom:34px;opacity:.95}
#gate h1{color:#fff;font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0 0 10px;line-height:1.25}
#gate p{color:#9593A1;font-size:14.5px;line-height:1.55;margin:0 0 26px}
#gate input{width:100%;box-sizing:border-box;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:15px 18px;color:#fff;font-size:16px;font-family:inherit;outline:none;text-align:center;letter-spacing:.04em}
#gate input:focus{border-color:#863DFF;background:rgba(255,255,255,.09)}
#gate button{width:100%;margin-top:12px;background:#863DFF;color:#fff;border:none;border-radius:12px;padding:15px 18px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
#gate button:hover{background:#9B5CFF}
#gate button:disabled{opacity:.6;cursor:default}
#gate .err{color:#FF7A7A;font-size:13.5px;margin-top:16px;min-height:20px;font-weight:600}
#gate .ft{color:#5A5A6E;font-size:12px;margin-top:34px;letter-spacing:.02em}
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <img class="lg" src="data:image/png;base64," alt="">
    <h1>Informe de Resultados POC<br>Banco Ripley</h1>
    <p>Este documento contiene información confidencial de la operacion. Ingresa la contraseña para acceder al contenido.</p>
    <input id="pw" type="password" placeholder="Contraseña" autocomplete="off" autofocus>
    <button id="go">Ver informe</button>
    <div class="err" id="err"></div>
    <div class="ft">Costanera Center y Plaza Oeste &middot; 2026</div>
  </div>
</div>
<div id="doc"></div>

<script>
const PAYLOAD = {"s": "5b5SbR+wyk40kfaNOcSqZA==", "i": "sxTYr7k2lscgYCZw", "c": "", "n": 250000};
const b64 = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));

async function unlock(){
  const btn = document.getElementById('go'), err = document.getElementById('err');
  const pw = document.getElementById('pw').value;
  if(!pw){ err.textContent = 'Ingresa la contraseña.'; return; }
  if(!window.crypto || !window.crypto.subtle){
    err.textContent = 'Abre este archivo en un navegador web actualizado.'; return;
  }
  btn.disabled = true; btn.textContent = 'Verificando…'; err.textContent = '';
  try{
    const enc = new TextEncoder();
    const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b64(PAYLOAD.s), iterations:PAYLOAD.n, hash:'SHA-256'},
      base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(PAYLOAD.i)}, key, b64(PAYLOAD.c));
    const html = new TextDecoder().decode(plain);

    const doc = document.getElementById('doc');
    doc.innerHTML = html;
    doc.querySelectorAll('script').forEach(old => {
      const sc = document.createElement('script');
      sc.textContent = old.textContent;
      old.replaceWith(sc);
    });
    document.getElementById('gate').remove();
    window.scrollTo(0,0);
  }catch(e){
    btn.disabled = false; btn.textContent = 'Ver informe';
    err.textContent = 'Contraseña incorrecta. Intenta nuevamente.';
    document.getElementById('pw').value = '';
    document.getElementById('pw').focus();
  }
}
document.getElementById('go').addEventListener('click', unlock);
document.getElementById('pw').addEventListener('keydown', e => { if(e.key === 'Enter') unlock(); });
</script>

</body>
</html>
